    (() => {

        vpn: { label: 'VPN', icon: 'shield-check', mode: '企业连接' },
        proxy: { label: '代理', icon: 'globe', mode: '系统代理 · 规则' }
      };
      let accounts = [
        { id: 'work', label: '办公账号', username: 'work.user', avatar: '办', connections: {
          wifi: [{ id: 'office', name: 'Office-WiFi', detail: '企业 Wi-Fi' }, { id: 'meeting', name: 'Meeting-WiFi', detail: '企业 Wi-Fi' }],
          vpn: [{ id: 'atrust', name: '公司内网', detail: 'aTrust' }],
          proxy: [{ id: 'work-proxy', name: '办公规则', detail: 'Clash Verge · 工作配置' }]
        }},
        { id: 'personal', label: '个人账号', username: 'personal.user', avatar: '个', connections: {
          wifi: [{ id: 'home', name: 'Home-WiFi', detail: '个人 Wi-Fi' }, { id: 'hotspot', name: 'Phone-Hotspot', detail: '手机热点' }],
          vpn: [{ id: 'cisco', name: '项目专网', detail: 'Cisco Secure Client' }],
          proxy: [{ id: 'personal-proxy', name: '日常规则', detail: 'Clash Verge · 个人配置' }]
        }}
      ];
      let index;
      function rebuildIndex() { index = Object.fromEntries(types.map(type => [type, accounts.flatMap(account => account.connections[type].map(connection => ({ ...connection, account: account.id, accountLabel: account.label })))])); }
      rebuildIndex();
      const defaults = () => ({ version: 2, activeType: 'wifi', enabled: { wifi: true, vpn: true, proxy: true }, selected: { wifi: 'office', vpn: 'cisco', proxy: 'work-proxy' }, open: { work: false, personal: false } });

      const identifier = value => typeof value === 'string' && /^[a-zA-Z0-9-]{1,80}$/.test(value);
      const text = (value, length) => typeof value === 'string' && value.length <= length;
      function restore(saved) {
        if (!saved || ![1, 2].includes(saved.version)) return;

          const uniqueAccounts = new Set(saved.accounts.map(account => account.id)).size === saved.accounts.length;
          const allConnections = valid ? saved.accounts.flatMap(account => types.flatMap(type => account.connections[type])) : [];
          const uniqueConnections = new Set(allConnections.map(item => item.id)).size === allConnections.length;
          if (valid && uniqueAccounts && uniqueConnections && types.every(type => saved.accounts.some(account => account.connections[type].length))) {
            accounts = saved.accounts.map(account => ({ id: account.id, label: account.label, username: account.username, avatar: Array.from(account.label)[0], connections: Object.fromEntries(types.map(type => [type, account.connections[type].map(item => ({ id: item.id, name: item.name, detail: item.detail, mode: ['系统代理', 'TUN'].includes(item.mode) ? item.mode : undefined }))])) }));

      const tabs = root.querySelector('.ns-tabs');
      function switchPage(type, focus = false) {
        if (editing || !types.includes(type) || type === state.activeType) return;
        const direction = types.indexOf(type) > types.indexOf(state.activeType) ? 1 : -1;
        state.activeType = type;
        otherOpen = false;
        render();
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          accountList.getAnimations().forEach(animation => animation.cancel());
          accountList.animate([{ transform: `translateX(${direction * 24}px)`, opacity: .5 }, { transform: 'translateX(0)', opacity: 1 }], { duration: 170, easing: 'ease-out' });
        }
        if (focus) tabs.querySelector(`[data-tab="${type}"]`).focus();
        announce(`${meta[type].label} · ${actual(type).text}`);
        save();
      }
      function stepPage(direction) {
        const index = Math.max(0, Math.min(types.length - 1, types.indexOf(state.activeType) + direction));
        switchPage(types[index]);
      }
      tabs.addEventListener('click', event => {
        const tab = event.target.closest('[data-tab]');
        if (tab) switchPage(tab.dataset.tab);
      });
      tabs.addEventListener('keydown', event => {
        const keys = ['ArrowLeft', 'ArrowRight', 'Home', 'End'];
        if (!keys.includes(event.key) || editing) return;
        event.preventDefault();
        const current = types.indexOf(state.activeType);
        const next = event.key === 'Home' ? 0 : event.key === 'End' ? 2 : (current + (event.key === 'ArrowRight' ? 1 : -1) + types.length) % types.length;
        switchPage(types[next], true);
      });
      let gesture = null, suppressClickUntil = 0;
      page.addEventListener('pointerdown', event => {
        if (editing || !event.isPrimary || event.button !== 0 || event.target.closest('input, select, textarea')) return;
        gesture = { id: event.pointerId, x: event.clientX, y: event.clientY, swiping: false };
      });
      page.addEventListener('pointermove', event => {
        if (!gesture || gesture.id !== event.pointerId) return;
        const dx = event.clientX - gesture.x, dy = event.clientY - gesture.y;
        if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.3) {
          gesture.swiping = true;
          page.setPointerCapture(event.pointerId);
        }
      });
      page.addEventListener('pointerup', event => {
        if (!gesture || gesture.id !== event.pointerId) return;
        const dx = event.clientX - gesture.x, dy = event.clientY - gesture.y;
        if (gesture.swiping) {
          suppressClickUntil = Date.now() + 350;
          if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3) stepPage(dx < 0 ? 1 : -1);
        }
        gesture = null;
      });
      page.addEventListener('pointercancel', () => { gesture = null; });
      page.addEventListener('click', event => {
        if (Date.now() < suppressClickUntil) { event.preventDefault(); event.stopPropagation(); }
      }, true);
      let wheelTotal = 0, lastWheel = 0, wheelBlockedUntil = 0;
      page.addEventListener('wheel', event => {
        if (editing || Math.abs(event.deltaX) <= Math.abs(event.deltaY)) return;
        event.preventDefault();
        const now = Date.now();
        if (now - lastWheel > 160) wheelTotal = 0;
        lastWheel = now;
        if (now < wheelBlockedUntil) return;
        wheelTotal += event.deltaX * (event.deltaMode === 1 ? 16 : 1);
        if (Math.abs(wheelTotal) > 45) {
          stepPage(wheelTotal > 0 ? 1 : -1);
          wheelTotal = 0;
          wheelBlockedUntil = now + 500;
        }
      }, { passive: false });
      const menuTrigger = root.querySelector('.ns-menu-trigger');
      menuTrigger.addEventListener('click', () => {
        menuWindow.hidden = !menuWindow.hidden;
        menuTrigger.setAttribute('aria-expanded', String(!menuWindow.hidden));
      });
      menuWindow.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !editing && !event.defaultPrevented) {
          menuWindow.hidden = true;
          menuTrigger.setAttribute('aria-expanded', 'false');
          menuTrigger.focus();
        }
      });
      window.addEventListener('openai:set_globals', event => {
        const saved = event.detail?.globals?.widgetState?.privateContent?.networkDemo;
        if (!saved || editing || types.some(type => pending[type])) return;
        const previousAccounts = JSON.stringify(accounts);
        restore(saved);
        if (previousAccounts !== JSON.stringify(accounts)) renderAccounts();
        render();
      });
      render();
      if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: () => { render(); save(); } });
        tweak.addSelect(presentation, 'density', { label: '列表密度', options: [{ label: '标准', value: 'standard' }, { label: '紧凑', value: 'compact' }] });
      }
    })();
  </script>
</div>
