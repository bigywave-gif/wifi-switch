&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();

  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;

   * @returns {Promise&lt;void&gt;}
   */

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );

    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }

        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },

    }
    if (fileElement != null) {
      const files = parse(fileElement.textContent);
      fileElement.remove();
      const blobs = new Map();
      const urls = [];
      for (const [name, binding] of Object.entries(bindings)) {
        if (binding.type !== &quot;file&quot; || !hasOwn(files, binding.path)) continue;

        if (blob == null) {

            Uint8Array.from(atob(file.base64), (char) =&gt; char.charCodeAt(0));

        urls.push(url);

        updates.push({ name, revision: 1, state: &quot;ready&quot;, value: { type: &quot;file&quot;, ...file } });

    connectorGlobals.visualization = {
      get bindings() {
        return bindings;
      },
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {

        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }

            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }

    { capture: true },
  );

  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {

    }

      let id;
      try {
        id = decodeURIComponent(href.slice(1));

      }

      });

    }
    event.preventDefault();
    openExternal({ href });
  });

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;network-switch-demo&#x27;);
      root.dataset.view = &#x27;menu&#x27;;
      const types = [&#x27;wifi&#x27;, &#x27;vpn&#x27;, &#x27;proxy&#x27;];
      const meta = {
        wifi: { label: &#x27;WI-FI&#x27;, icon: &#x27;wifi&#x27;, mode: &#x27;无线网络&#x27; },
        vpn: { label: &#x27;VPN&#x27;, icon: &#x27;shield-check&#x27;, mode: &#x27;企业连接&#x27; },
        proxy: { label: &#x27;代理&#x27;, icon: &#x27;globe&#x27;, mode: &#x27;系统代理 · 规则&#x27; }
      };
      let accounts = [
        { id: &#x27;work&#x27;, label: &#x27;办公账号&#x27;, username: &#x27;work.user&#x27;, avatar: &#x27;办&#x27;, connections: {
          wifi: [{ id: &#x27;office&#x27;, name: &#x27;Office-WiFi&#x27;, detail: &#x27;企业 Wi-Fi&#x27; }, { id: &#x27;meeting&#x27;, name: &#x27;Meeting-WiFi&#x27;, detail: &#x27;企业 Wi-Fi&#x27; }],
          vpn: [{ id: &#x27;atrust&#x27;, name: &#x27;公司内网&#x27;, detail: &#x27;aTrust&#x27; }],
          proxy: [{ id: &#x27;work-proxy&#x27;, name: &#x27;办公规则&#x27;, detail: &#x27;Clash Verge · 工作配置&#x27; }]
        }},
        { id: &#x27;personal&#x27;, label: &#x27;个人账号&#x27;, username: &#x27;personal.user&#x27;, avatar: &#x27;个&#x27;, connections: {
          wifi: [{ id: &#x27;home&#x27;, name: &#x27;Home-WiFi&#x27;, detail: &#x27;个人 Wi-Fi&#x27; }, { id: &#x27;hotspot&#x27;, name: &#x27;Phone-Hotspot&#x27;, detail: &#x27;手机热点&#x27; }],
          vpn: [{ id: &#x27;cisco&#x27;, name: &#x27;项目专网&#x27;, detail: &#x27;Cisco Secure Client&#x27; }],
          proxy: [{ id: &#x27;personal-proxy&#x27;, name: &#x27;日常规则&#x27;, detail: &#x27;Clash Verge · 个人配置&#x27; }]
        }}
      ];
      let index;
      function rebuildIndex() { index = Object.fromEntries(types.map(type =&gt; [type, accounts.flatMap(account =&gt; account.connections[type].map(connection =&gt; ({ ...connection, account: account.id, accountLabel: account.label })))])); }
      rebuildIndex();
      const defaults = () =&gt; ({ version: 2, activeType: &#x27;wifi&#x27;, enabled: { wifi: true, vpn: true, proxy: true }, selected: { wifi: &#x27;office&#x27;, vpn: &#x27;cisco&#x27;, proxy: &#x27;work-proxy&#x27; }, open: { work: false, personal: false } });
      const state = defaults();
      const pending = { wifi: false, vpn: false, proxy: false };
      const timers = {};
      const presentation = { density: &#x27;standard&#x27; };
      const icon = name =&gt; `&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
      const escape = value =&gt; String(value ?? &#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, character =&gt; ({ &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; })[character]);
      const identifier = value =&gt; typeof value === &#x27;string&#x27; &amp;&amp; /^[a-zA-Z0-9-]{1,80}$/.test(value);
      const text = (value, length) =&gt; typeof value === &#x27;string&#x27; &amp;&amp; value.length &lt;= length;
      function restore(saved) {
        if (!saved || ![1, 2].includes(saved.version)) return;
        if (types.includes(saved.activeType)) state.activeType = saved.activeType;
        if (Array.isArray(saved.accounts) &amp;&amp; saved.accounts.length &amp;&amp; saved.accounts.length &lt;= 128) {
          const valid = saved.accounts.every(account =&gt; identifier(account.id) &amp;&amp; text(account.label, 40) &amp;&amp; account.label.trim() &amp;&amp; text(account.username, 64) &amp;&amp; types.every(type =&gt; Array.isArray(account.connections?.[type]) &amp;&amp; account.connections[type].length &lt;= 128 &amp;&amp; account.connections[type].every(item =&gt; identifier(item.id) &amp;&amp; text(item.name, 64) &amp;&amp; item.name.trim() &amp;&amp; text(item.detail, 240))));
          const uniqueAccounts = new Set(saved.accounts.map(account =&gt; account.id)).size === saved.accounts.length;
          const allConnections = valid ? saved.accounts.flatMap(account =&gt; types.flatMap(type =&gt; account.connections[type])) : [];
          const uniqueConnections = new Set(allConnections.map(item =&gt; item.id)).size === allConnections.length;
          if (valid &amp;&amp; uniqueAccounts &amp;&amp; uniqueConnections &amp;&amp; types.every(type =&gt; saved.accounts.some(account =&gt; account.connections[type].length))) {
            accounts = saved.accounts.map(account =&gt; ({ id: account.id, label: account.label, username: account.username, avatar: Array.from(account.label)[0], connections: Object.fromEntries(types.map(type =&gt; [type, account.connections[type].map(item =&gt; ({ id: item.id, name: item.name, detail: item.detail, mode: [&#x27;系统代理&#x27;, &#x27;TUN&#x27;].includes(item.mode) ? item.mode : undefined }))])) }));
            rebuildIndex();
          }
        }
        for (const type of types) {
          if (typeof saved.enabled?.[type] === &#x27;boolean&#x27;) state.enabled[type] = saved.enabled[type];
          if (index[type].some(item =&gt; item.id === saved.selected?.[type])) state.selected[type] = saved.selected[type];
          else if (!index[type].some(item =&gt; item.id === state.selected[type])) state.selected[type] = index[type][0].id;
        }
        for (const account of accounts) if (typeof saved.open?.[account.id] === &#x27;boolean&#x27;) state.open[account.id] = saved.open[account.id];
        if ([&#x27;standard&#x27;, &#x27;compact&#x27;].includes(saved.density)) presentation.density = saved.density;
        if (root.dataset.view === &#x27;menu&#x27;) accounts.forEach(account =&gt; { state.open[account.id] = false; });
      }
      restore(window.openai?.widgetState?.privateContent?.networkDemo);
      const masters = root.querySelector(&#x27;.ns-masters&#x27;);
      const configMasters = root.querySelector(&#x27;.ns-config-masters&#x27;);
      const accountList = root.querySelector(&#x27;.ns-accounts&#x27;);
      const otherList = root.querySelector(&#x27;.ns-other-list&#x27;);
      const otherToggle = root.querySelector(&#x27;.ns-other-toggle&#x27;);
      let otherOpen = false;
      masters.innerHTML = `&lt;article class=&quot;ns-master&quot;&gt;
        &lt;div class=&quot;ns-master-heading&quot;&gt;&lt;span class=&quot;ns-kind-title&quot;&gt;&lt;/span&gt;
          &lt;label class=&quot;ns-switch cursor-interaction&quot;&gt;&lt;input type=&quot;checkbox&quot; role=&quot;switch&quot;&gt;&lt;span class=&quot;ns-switch-track&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/label&gt;
        &lt;/div&gt;&lt;div class=&quot;ns-current-row&quot;&gt;&lt;span class=&quot;ns-current-icon&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;div class=&quot;ns-current-copy&quot;&gt;&lt;div class=&quot;ns-target&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ns-owner&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;ns-current-check&quot; aria-hidden=&quot;true&quot;&gt;${icon(&#x27;check&#x27;)}&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ns-master-footer&quot;&gt;&lt;span class=&quot;ns-badge&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ns-mode&quot;&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;/article&gt;`;
      configMasters.innerHTML = types.map(type =&gt; `&lt;article class=&quot;ns-master&quot; data-type=&quot;${type}&quot; aria-label=&quot;${meta[type].label} 总开关与当前连接&quot;&gt;&lt;div class=&quot;ns-master-heading&quot;&gt;&lt;span class=&quot;ns-kind-icon&quot;&gt;${icon(meta[type].icon)}&lt;/span&gt;&lt;span class=&quot;ns-kind-title&quot;&gt;${meta[type].label}&lt;/span&gt;&lt;label class=&quot;ns-switch cursor-interaction&quot;&gt;&lt;input type=&quot;checkbox&quot; role=&quot;switch&quot; data-switch=&quot;${type}&quot; aria-label=&quot;${meta[type].label} 总开关&quot;&gt;&lt;span class=&quot;ns-switch-track&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;ns-target&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ns-owner&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ns-master-footer&quot;&gt;&lt;span class=&quot;ns-badge&quot;&gt;&lt;/span&gt;&lt;span class=&quot;ns-mode&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;`).join(&#x27;&#x27;);
      function renderAccounts() {
